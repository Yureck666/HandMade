<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Уютный уголок — украшения и игрушки ручной работы</title>
<meta name="description" content="Украшения и игрушки ручной работы — сделано с теплом.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header" id="top">
  <div class="header-inner">
    <a href="#top" class="logo">Уютный уголок</a>
    <nav class="main-nav" id="mainNav" aria-label="Разделы"></nav>
    <a href="#contacts" class="btn btn-accent btn-header-contact">Написать</a>
  </div>
</header>

<main>
  <section class="hero">
    <p id="heroText">Здесь живут украшения и игрушки, сделанные вручную — с теплом и вниманием к мелочам.</p>
  </section>

  <div id="categoriesRoot"></div>
</main>

<footer class="site-footer" id="contacts">
  <p class="footer-text">Чтобы заказать или просто спросить — напишите, буду рада ответить :)</p>
  <div class="contact-buttons" id="contactButtons"></div>
  <p class="footer-signature">Уютный уголок</p>
</footer>

<div id="lightbox" class="lightbox hidden" aria-hidden="true">
  <button type="button" class="lightbox-close" aria-label="Закрыть">×</button>
  <button type="button" class="lightbox-arrow lightbox-prev" aria-label="Предыдущее">‹</button>
  <div id="lightboxContent" class="lightbox-content"></div>
  <button type="button" class="lightbox-arrow lightbox-next" aria-label="Следующее">›</button>
  <div id="lightboxDots" class="lightbox-dots"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
